<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#2dd4bf" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background Rounded Shield -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="116" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="4" />
  
  <!-- Biometric Scanner Grid Circle -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2" stroke-dasharray="8 8" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="rgba(52,211,153,0.3)" stroke-width="3" />
  
  <!-- Graduation Cap & School Icon -->
  <path d="M256 120 L380 185 L256 250 L132 185 Z" fill="#ffffff" filter="url(#glow)" />
  <path d="M175 210 L175 270 Q256 320 337 270 L337 210 Q256 260 175 210 Z" fill="#e6fffa" />
  <path d="M375 190 L395 240 L385 245 L365 195 Z" fill="#fbbf24" />
  <circle cx="390" cy="245" r="7" fill="#fbbf24" />
  
  <!-- Clock & Check Badge Indicator -->
  <g transform="translate(256, 335)">
    <circle cx="0" cy="0" r="60" fill="#064e3b" stroke="#34d399" stroke-width="6" filter="url(#glow)" />
    <!-- Checkmark -->
    <path d="M-22 -2 L-6 16 L24 -16" fill="none" stroke="#34d399" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  
  <!-- Corner Scan Brackets -->
  <path d="M120 160 L120 120 L160 120" fill="none" stroke="#34d399" stroke-width="8" stroke-linecap="round" />
  <path d="M392 160 L392 120 L352 120" fill="none" stroke="#34d399" stroke-width="8" stroke-linecap="round" />
  <path d="M120 352 L120 392 L160 392" fill="none" stroke="#34d399" stroke-width="8" stroke-linecap="round" />
  <path d="M392 352 L392 392 L352 392" fill="none" stroke="#34d399" stroke-width="8" stroke-linecap="round" />
</svg>
