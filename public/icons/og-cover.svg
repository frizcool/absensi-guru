<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07111a" />
      <stop offset="50%" stop-color="#0c232c" />
      <stop offset="100%" stop-color="#093832" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="100%" stop-color="#2dd4bf" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Ambient Glow Spheres -->
  <circle cx="150" cy="120" r="320" fill="#0d9488" opacity="0.18" filter="blur(70px)" />
  <circle cx="1050" cy="480" r="280" fill="#10b981" opacity="0.15" filter="blur(80px)" />

  <!-- Top Accent Line -->
  <rect x="0" y="0" width="1200" height="6" fill="url(#primaryGrad)" />

  <!-- Left Content Group -->
  <g transform="translate(100, 110)">
    <!-- School & System Tag -->
    <rect x="0" y="0" width="310" height="38" rx="19" fill="rgba(52, 211, 153, 0.12)" stroke="rgba(52, 211, 153, 0.35)" stroke-width="1" />
    <circle cx="18" cy="19" r="5" fill="#34d399" />
    <text x="32" y="24" fill="#a7f3d0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">PORTAL RESMI SEKOLAH</text>

    <!-- Main Title -->
    <text x="0" y="95" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" letter-spacing="-1">Sistem Absensi Guru</text>
    <text x="0" y="152" fill="url(#primaryGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="700">&amp; Tenaga Kependidikan</text>

    <!-- Subtitle / Description -->
    <text x="0" y="210" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400">
      Presensi Mandiri Real-Time • Validasi Geofencing GPS • Biometrik Wajah
    </text>
    <text x="0" y="240" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400">
      Jurnal Mengajar Terintegrasi • Rekapitulasi SPTJB Kedinasan Otomatis
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 285)">
      <!-- Pill 1: GPS Radius -->
      <g transform="translate(0, 0)">
        <rect width="180" height="42" rx="12" fill="rgba(15, 23, 42, 0.7)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
        <text x="18" y="26" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">📍 Geofence GPS</text>
      </g>
      <!-- Pill 2: Face Biometric -->
      <g transform="translate(195, 0)">
        <rect width="180" height="42" rx="12" fill="rgba(15, 23, 42, 0.7)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
        <text x="18" y="26" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">🤳 Selfie Biometrik</text>
      </g>
      <!-- Pill 3: Live Kiosk -->
      <g transform="translate(390, 0)">
        <rect width="180" height="42" rx="12" fill="rgba(15, 23, 42, 0.7)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
        <text x="18" y="26" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">📺 Live TV Display</text>
      </g>
      <!-- Pill 4: SPTJB PDF -->
      <g transform="translate(585, 0)">
        <rect width="180" height="42" rx="12" fill="rgba(15, 23, 42, 0.7)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
        <text x="18" y="26" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">📄 Cetak SPTJB</text>
      </g>
    </g>

    <!-- School Footer Meta -->
    <g transform="translate(0, 375)">
      <circle cx="12" cy="12" r="10" fill="#0d9488" />
      <text x="12" y="16" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle">✓</text>
      <text x="32" y="16" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500">Aplikasi Resmi Presensi Pendidikan Nasional</text>
    </g>
  </g>

  <!-- Right Hero Emblem / Badge -->
  <g transform="translate(900, 160)" filter="url(#shadow)">
    <rect width="200" height="200" rx="46" fill="url(#primaryGrad)" />
    <rect x="8" y="8" width="184" height="184" rx="38" fill="none" stroke="rgba(255, 255, 255, 0.2)" stroke-width="2" />
    
    <!-- Shield / School & Attendance Symbol -->
    <path d="M 100 45 L 155 75 L 100 105 L 45 75 Z" fill="#ffffff" />
    <path d="M 65 85 L 65 115 Q 100 140 135 115 L 135 85 Q 100 110 65 85 Z" fill="#ccfbf1" />
    
    <!-- Checkmark Badge -->
    <circle cx="100" cy="142" r="26" fill="#064e3b" stroke="#34d399" stroke-width="3" />
    <path d="M 90 142 L 97 150 L 112 134" fill="none" stroke="#34d399" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
